[package]
name = "phys-type"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Tatsuki Kodama"]
description = "Dimension-aware physical quantities and cosmological background integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inuverse44/phys-type"
readme = "README.md"
keywords = ["physics", "units", "cosmology", "numerics"]
categories = ["science", "mathematics"]
exclude = ["daily/**", "phys-type.key"]

[dependencies]
num-complex = "0.4.6"
typenum = "1.20.1"

[dev-dependencies]
trybuild = "1.0.121"
